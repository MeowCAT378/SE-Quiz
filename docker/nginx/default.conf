map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /pgadmin {
        absolute_redirect off;
        return 308 /pgadmin/$is_args$args;
    }

    location ^~ /pgadmin/ {
        absolute_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        # pgAdmin's logout can redirect to the origin root.
        proxy_redirect ~^/$ /pgadmin/;
        proxy_pass http://pgadmin:80/;
    }

    location = ${BASE_PATH} {
        absolute_redirect off;
        return 308 ${BASE_PATH}/$is_args$args;
    }

    # Service callbacks use the private Compose address, never this public listener.
    location ~ ^${BASE_PATH}/(?:[^/]+/)?api/host/(?:authorize|completed)(?:/|$) {
        return 404;
    }

    location ~ ^${BASE_PATH}/backend/alive/[^/]+$ {
        if ($request_method != GET) { return 405; }
        rewrite ^${BASE_PATH}/backend/(.*)$ /$1 break;
        proxy_pass http://game-server:8080;
    }

    location ~ ^${BASE_PATH}/backend/watch/[^/]+/[^/]+$ {
        if ($request_method != GET) { return 405; }
        rewrite ^${BASE_PATH}/backend/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://game-server:8080;
    }

    location = ${BASE_PATH}/media/upload {
        if ($request_method != POST) { return 405; }
        proxy_pass http://corkboard:5040/upload;
    }

    location ~ ^${BASE_PATH}/media/get/[^/]+$ {
        if ($request_method != GET) { return 405; }
        rewrite ^${BASE_PATH}/media/(.*)$ /$1 break;
        proxy_pass http://corkboard:5040;
    }

    location = ${BASE_PATH}/backend { return 404; }
    location ${BASE_PATH}/backend/ { return 404; }
    location = ${BASE_PATH}/media { return 404; }
    location ${BASE_PATH}/media/ { return 404; }

    location ${BASE_PATH}/ {
        # SvelteKit receives its real base path. Streaming publication stays unbuffered.
        # SvelteKit's module-preload Link header exceeds Nginx's default 4 KiB buffer.
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://web:3000;
    }

    location / { return 404; }
}
