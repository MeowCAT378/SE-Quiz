<!doctype html>
<html
  lang="%paraglide.lang%"
  dir="%paraglide.textDirection%"
  data-theme="light"
  style="min-height: 100%; display: flex"
>
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    %sveltekit.head%
    <title>SE Quiz | Live Quiz Platform</title>
    <meta
      name="description"
      content="A free platform for hosting collaborative quizzes"
    />
    <meta property="og:title" content="SE Quiz" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%sveltekit.assets%/image.png" />
    <meta property="og:image:alt" content="SE Quiz: Live Quiz Platform" />
    <meta
      property="og:description"
      content="A free platform for hosting collaborative quizzes"
    />
    <meta property="og:site_name" content="SE Quiz" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") === "dark" ? "dark" : "light",
      );
    </script>
  </head>

  <body data-sveltekit-preload-data="hover" style="display: contents">
    <div style="flex: 1; min-width: 0">%sveltekit.body%</div>
  </body>
</html>
